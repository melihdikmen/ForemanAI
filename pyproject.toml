[project]
name = "foremanai"
version = "0.1.0"
description = "Fabrika Bakım Asistanı — fabrika bakım ekibi için arıza teşhis ve iş emri asistanı"
readme = "README.md"
authors = [
    { name = "Melih Dikmen", email = "melihdikmen06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Bu bir uygulama (dağıtılacak paket değil); uv projeyi wheel olarak kurmasın.
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
# Satır uzunluğu (siyah/black geleneği 88). TS'teki prettier printWidth gibi.
line-length = 100
target-version = "py312"
# Alembic'in otomatik ürettiği migration dosyalarını lint etme (kendi env.py'miz dahil değil).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle (temel hatalar), I: import sıralama, UP: modern Python,
# B: bug-prone kalıplar. İleride genişletiriz.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

