# Local development database: PostgreSQL 16 with the pgvector extension.
# Values come from .env (docker compose reads it automatically for ${...} substitution).

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: foremanai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — expose the DB on the host port from .env
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume keeps data across restarts.
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, only when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Marks the container "healthy" only when Postgres actually accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
